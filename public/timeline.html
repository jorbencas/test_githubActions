<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0604">
  <meta name="description" content="Tech Timeline — Recorre la historia de la tecnología desde los mainframes de los años 60 hasta la IA generativa. Navegación horizontal interactiva con parallax, efectos de partículas y más de 300 eventos.">
  <meta name="author" content="Jorge Beneyto Castelló">
  <meta property="og:title" content="Tech Timeline — La Historia de la Tecnología">
  <meta property="og:description" content="Recorrido interactivo por la historia de la tecnología: mainframes, PCs, internet, móviles, cloud e IA. Más de 300 eventos con efectos visuales.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jorbencasdownloaderdocument.surge.sh/timeline.html">
  <meta property="og:site_name" content="Tech Timeline">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@jorbencas">
  <meta name="twitter:creator" content="@jorbencas">
  <link rel="canonical" href="https://jorbencasdownloaderdocument.surge.sh/timeline.html">
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
  <title>Tech Timeline — La Historia de la Tecnología</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Tech Timeline",
    "url": "https://jorbencasdownloaderdocument.surge.sh/timeline.html",
    "author": { "@type": "Person", "name": "Jorge Beneyto Castelló", "url": "https://github.com/jorbencas" },
    "description": "Recorrido interactivo por la historia de la tecnología con más de 300 eventos."
  }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Era background layers -->
  <div id="era-bg" class="era-bg"></div>
  <div id="era-overlay" class="era-overlay"></div>

  <!-- Parallax layers -->
  <div id="parallax-back" class="parallax-layer" data-speed="0.08"></div>
  <div id="parallax-mid" class="parallax-layer" data-speed="0.2"></div>
  <canvas id="fx-canvas" class="fx-canvas"></canvas>
  <div id="parallax-front" class="parallax-layer" data-speed="0.4"></div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Loading -->
  <div id="loading">
    <div class="loader">
      <div class="loader-fire"></div>
      <div class="loader-text">
        <span class="loader-title">Tech Timeline</span>
        <span class="loader-sub">Encendiendo la hoguera...</span>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <a href="/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.6"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <h1 class="logo">Tech <span>Timeline</span></h1>
      </a>
    </div>
    <div class="header-center">
      <div id="year-display" class="year-display">1970</div>
    </div>
    <div class="era-label" id="era-label">La Edad de los Mainframes</div>
  </header>

  <!-- Timeline -->
  <div id="timeline-container" class="timeline-container">
    <div id="timeline-track" class="timeline-track"></div>
  </div>

  <!-- Year Bar -->
  <div id="year-bar" class="year-bar">
    <div class="year-bar-indicator">
      <div class="year-bar-track"></div>
      <div class="year-bar-tick-marks" id="year-bar-tick-marks"></div>
      <div id="year-bar-needle" class="year-bar-needle">
        <div class="year-bar-needle-line"></div>
        <div class="year-bar-needle-dot"></div>
        <div id="year-bar-label" class="year-bar-label">1970</div>
      </div>
    </div>
    <div id="year-bar-line" class="year-bar-line"></div>
    <div id="year-bar-inner" class="year-bar-inner"></div>
  </div>

  <!-- Scroll Hint -->
  <div id="scroll-hint" class="scroll-hint">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
    <span>Desliza para explorar</span>
  </div>

  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
