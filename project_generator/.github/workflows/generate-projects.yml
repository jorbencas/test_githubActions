name: Generate Project Ideas

on:
  schedule:
    # Cada lunes a las 9:00 UTC (ajustar según zona horaria)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Número de proyectos a generar'
        required: false
        default: '5'
        type: string
      nivel:
        description: 'Filtrar por nivel (junior/semisenior/senior)'
        required: false
        type: string
      scope:
        description: 'Filtrar por scope (miniproyecto/proyecto/multiproyecto)'
        required: false
        type: string
      lenguaje:
        description: 'Filtrar por lenguaje (python/javascript/typescript/csharp/go/rust)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID: ${{ secrets.TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o-mini' }}
      PROJECTS_PER_RUN: ${{ github.event.inputs.count || vars.PROJECTS_PER_RUN || '5' }}
      SCRAPE_TUWEB_DEV: ${{ vars.SCRAPE_TUWEB_DEV || 'true' }}
      DATA_DIR: ./data
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: project_generator/requirements.txt
      
      - name: Install dependencies
        run: |
          cd project_generator
          pip install -r requirements.txt
      
      - name: Create data directory
        run: mkdir -p project_generator/data
      
      - name: Generate projects
        id: generate
        run: |
          cd project_generator
          
          # Construir argumentos opcionales
          ARGS=()
          if [[ -n "${{ github.event.inputs.nivel }}" ]]; then
            ARGS+=(--nivel "${{ github.event.inputs.nivel }}")
          fi
          if [[ -n "${{ github.event.inputs.scope }}" ]]; then
            ARGS+=(--scope "${{ github.event.inputs.scope }}")
          fi
          if [[ -n "${{ github.event.inputs.lenguaje }}" ]]; then
            ARGS+=(--lenguaje "${{ github.event.inputs.lenguaje }}")
          fi
          
          python -m src.main generate "${ARGS[@]}"
        env:
          PYTHONPATH: project_generator/src
      
      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-history
          path: project_generator/data/generated_projects.json
          retention-days: 90
      
      - name: Commit history if changed
        run: |
          cd project_generator
          if git diff --quiet data/generated_projects.json; then
            echo "No changes in history"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/generated_projects.json
            git commit -m "chore: update project history [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}