name: "[PROJECTS] Generate & Send Projects"

on:
  schedule:
    - cron: '0 */4 * * *'  # Cada 4 horas (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  workflow_dispatch:
    inputs:
      count:
        description: 'Número de proyectos a generar'
        required: false
        default: '3'
        type: string
      nivel:
        description: 'Filtrar por nivel (junior/semisenior/senior)'
        required: false
        type: string
      scope:
        description: 'Filtrar por scope (miniproyecto/proyecto/multiproyecto)'
        required: false
        type: string
      lenguaje:
        description: 'Filtrar por lenguaje (python/javascript/typescript/csharp/go/rust)'
        required: false
        type: string

concurrency:
  group: generate-projects-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # para committear el historial

jobs:
  generate_and_send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID: ${{ secrets.TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Lista de modelos probados en orden (AI_MODEL admite comas). La cuota
      # free tier es por proyecto Y modelo (20/día) y la comparten los workflows
      # de scraping, así que el segundo modelo es una reserva: si flash-lite no
      # existe para la key o se queda sin cupo, salta a flash.
      AI_MODEL: ${{ vars.AI_MODEL || 'gemini-2.5-flash-lite,gemini-2.5-flash' }}
      PROJECTS_PER_RUN: ${{ inputs.count || vars.PROJECTS_PER_RUN || '3' }}
      SCRAPE_TUWEB_DEV: ${{ vars.SCRAPE_TUWEB_DEV || 'true' }}
      # En CI no debe enmascararse un fallo de Gemini con plantillas fijas
      ALLOW_DETERMINISTIC_FALLBACK: 'false'
      DATA_DIR: ./data

    steps:
      - name: Checkout test_githubActions
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: project_generator/requirements.txt

      - name: Install dependencies
        run: pip install -r project_generator/requirements.txt

      - name: Create data directory
        run: mkdir -p project_generator/data

      - name: Generate projects
        run: |
          set -euo pipefail
          cd project_generator
          ARGS=()
          if [[ -n "${{ inputs.nivel }}" ]]; then
            ARGS+=(--nivel "${{ inputs.nivel }}")
          fi
          if [[ -n "${{ inputs.scope }}" ]]; then
            ARGS+=(--scope "${{ inputs.scope }}")
          fi
          if [[ -n "${{ inputs.lenguaje }}" ]]; then
            ARGS+=(--lenguaje "${{ inputs.lenguaje }}")
          fi
          python -m src.main generate --count "$PROJECTS_PER_RUN" "${ARGS[@]}" --send-telegram

      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-history
          path: project_generator/data/generated_projects.json
          retention-days: 90

      - name: Commit history if changed
        run: |
          set -euo pipefail
          cd project_generator
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated_projects.json
          if git diff --cached --quiet; then
            echo "No changes in history"
          else
            git commit -m "chore: update project history [skip ci]"
            git push origin HEAD:master
          fi
