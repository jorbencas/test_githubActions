name: "[PROJECTS] Generate & Send Projects (local in test_githubActions)"

on:
  schedule:
    - cron: '0 */4 * * *'  # Cada 4 horas (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  workflow_dispatch:

concurrency:
  group: generate-projects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_and_send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: project_generator

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID: ${{ secrets.TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gemini-1.5-flash' }}
      PROJECTS_PER_RUN: ${{ vars.PROJECTS_PER_RUN || '3' }}
      SCRAPE_TUWEB_DEV: ${{ vars.SCRAPE_TUWEB_DEV || 'true' }}
      DATA_DIR: ./data

    steps:
      - name: Checkout test_githubActions
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: project_generator/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r project_generator/requirements.txt

      - name: Create data directory
        run: mkdir -p project_generator/data

      - name: Generate projects
        id: generate
        run: |
          cd project_generator
          python -m src.main generate --count "${PROJECTS_PER_RUN}" --send-telegram
        env:
          PYTHONPATH: project_generator/src
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}

      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-history
          path: project_generator/data/generated_projects.json
          retention-days: 90

      - name: Commit history if changed
        run: |
          cd project_generator
          if git diff --quiet data/generated_projects.json; then
            echo "No changes in history"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/generated_projects.json
            git commit -m "chore: update project history [skip ci]"
            git push origin master
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}