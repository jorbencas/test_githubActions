name: Telegram AI Bot (local)

# Bot de Telegram con IA local: cada 15 min lee mensajes dirigidos al bot
# (menciones @bot, respuestas a sus mensajes o /ai) y responde usando
# Qwen2.5 1.5B vía Ollama instalado en el propio runner.
#
# Requisitos:
#   - Secret TELEGRAM_BOT_TOKEN
#   - El bot debe estar en el grupo/canal. En grupos, desactivar su
#     "privacy mode" vía BotFather (/setprivacy → Disable) para ver todo,
#     o mencionarlo con @username para que reciba el mensaje.
#   - Los modelos se cachean con actions/cache (~1GB la primera vez).
#
# Sin estado en git: confirma los updates en el servidor de Telegram
# (offset) y filtra por antigüedad, así no toca el repo ni interfiere
# con los demás workflows.

on:
  schedule:
    # Cada 15 min: ~2.900 min/mes de runner (cabe en el free tier privado)
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-ai-bot
  cancel-in-progress: false

# Sin permisos de escritura: el bot no commitea nada al repo,
# así nunca choca con los pushes de los demás workflows.

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-1.5b
          restore-keys: ollama-

      - name: Instalar y arrancar Ollama + modelo
        run: |
          if ! command -v ollama >/dev/null; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:11434 >/dev/null && break
            sleep 1
          done
          ollama pull qwen2.5:1.5b

      - name: Procesar mensajes del bot
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OLLAMA_MODEL: qwen2.5:1.5b
          OLLAMA_URL: http://localhost:11434
        run: python scripts/telegram_ai_bot.py
