name: FormulaTV Daily Premieres → Telegram

on:
  schedule:
    - cron: '15,45 * * * *'  # Cada 30 minutos (minutos 15 y 45) - offset de send_telegram
  workflow_dispatch:  # Ejecución manual

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape FormulaTV Today & Send to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SALUDO_CHAT_ID: ${{ secrets.SALUDO_CHAT_ID }}
      TELEGRAM_REPORT_IMG_TOPIC_ID: ${{ secrets.TELEGRAM_REPORT_IMG_TOPIC_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run FormulaTV scraper → Telegram
        run: |
          python scripts/scrape_formulatv_telegram.py --crear-eventos --guardar-json || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALUDO_CHAT_ID: ${{ secrets.SALUDO_CHAT_ID }}
          TELEGRAM_REPORT_IMG_TOPIC_ID: ${{ secrets.TELEGRAM_REPORT_IMG_TOPIC_ID }}

      - name: Upload sent log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formulatv-sent-log
          path: files/formulatv_sent.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ FormulaTV Daily Scraper Failed',
              body: `Daily FormulaTV scraper failed. Check logs.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })