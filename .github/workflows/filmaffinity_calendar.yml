name: "Filmaffinity Series Scraper + Google Calendar"
on:
  schedule:
    - cron: "0 6 * * 1"   # Cada lunes a las 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar resultados sin crear eventos'
        required: false
        default: 'false'
        type: boolean
      crear_todos:
        description: 'Crear todos los eventos en Google Calendar'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  filmaffinity_scraper:
    name: "Filmaffinity Series Scraper + Google Calendar"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: scripts/scrapers/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-auth google-auth-oauthlib google-api-python-client

      - name: Scraping Filmaffinity + Google Calendar
        env:
          TIPS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALUDO_CHAT_ID: ${{ secrets.SALUDO_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          python scripts/scrapers/scrape_filmaffinity.py --enviar

      - name: Crear eventos en Google Calendar
        if: github.event.inputs.crear_todos == 'true'
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          python scripts/google_calendar_filmaffinity.py --crear-todos

      - name: Commit changes
        if: always()
        run: |
          git config user.name "filmaffinity-bot"
          git config user.email "filmaffinity-bot@users.noreply.github.com"
          git add files/filmaffinity_series.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "[filmaffinity] actualizar series y eventos calendar"
            git pull --rebase origin master
            git push origin HEAD:master
          fi