name: "[EIXAM] 🎬 Recopilar toda la info de la película Enjambre"
on:
  schedule:
    - cron: "17 */6 * * *"   # Cada 6 horas: 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:

jobs:
  recopilar_eixam:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests BeautifulSoup4 google-genai

      - name: 🎬 Recopilar información sobre Eixam (Enjambre) y enviar novedades al canal de imágenes
        id: scrape
        env:
          TIPS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALUDO_CHAT_ID: ${{ secrets.SALUDO_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/scrapers/scrape_eixam.py --enviar

      - name: 💾 Commit del archivo acumulado (persistencia duradera)
        if: always()
        run: |
          git config user.name "eixam-bot"
          git config user.email "eixam-bot@users.noreply.github.com"
          git add files/eixam_pelicula.json
          if git diff --cached --quiet; then
            echo "Sin cambios en eixam_pelicula.json"
          else
            git commit -m "[eixam] actualizar registro de la película Enjambre"
            git push origin master
          fi