name: "[BLOG] 🖼️ Optimizar imágenes del blog"
on:
  repository_dispatch:
    types: [optimize-images]
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 📂 Checkout blog repo
        uses: actions/checkout@v4
        with:
          repository: jorbencas/blog
          path: blog
          token: ${{ secrets.BLOG_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🖼️ Optimizar imágenes
        run: python -m scripts.tools.fix_images --blog-path blog

      - name: 📅 Actualizar updatedDate según historial
        run: python -m scripts.tools.bump_updated_dates --blog-path blog

      - name: 🚀 Push cambios al blog
        run: |
          cd blog
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet || (git commit -m "🖼️ optimize: imágenes y updatedDate [skip ci]" && git pull --rebase && git push)
