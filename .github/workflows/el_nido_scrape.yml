name: "[EL NIDO] 🎬 Recopilar info de la película El nido (2026)"
on:
  schedule:
    - cron: "47 */6 * * *"   # Cada 6 horas: 00:47, 06:47, 12:47, 18:47 UTC
  workflow_dispatch:

jobs:
  recopilar_el_nido:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master
          # Necesario para poder volver a hacer push a master al final
          persist-credentials: true
          fetch-depth: 0

      - name: ✅ Verificar checkout
        run: |
          git status
          test -d scripts/scrapers && echo "Éxito: scripts/scrapers presente"
          test -f scripts/scrapers/scrape_el_nido.py && echo "Éxito: scrape_el_nido.py presente"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests BeautifulSoup4 google-genai

      - name: 🎬 Recopilar información sobre El nido (2026) y enviar novedades al canal de imágenes
        id: scrape
        env:
          TIPS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALUDO_CHAT_ID: ${{ secrets.SALUDO_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/scrapers/scrape_el_nido.py --enviar

      - name: 💾 Commit del archivo acumulado (persistencia duradera)
        if: always()
        run: |
          git config user.name "el-nido-bot"
          git config user.email "el-nido-bot@users.noreply.github.com"
          git add files/el_nido_pelicula.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el_nido_pelicula.json"
          else
            git commit -m "[el nido] actualizar registro de la película El nido (2026)"
            git push origin HEAD:master
          fi