name: "[NOTICIAS] 🤖 Send Telegram Notification"
on:
  schedule:
    - cron: "*/30 * * * *" # Cada 30 minutos
    - cron: "0 19 * * *" # 19:00 UTC ≈ 20–21 h Madrid — ventana de audio
  workflow_dispatch:
    inputs:
      force_voice:
        description: "Forzar envío de audio de voz (ignora límite diario)"
        type: boolean
        default: false

concurrency:
  group: send-telegram-notifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  send_telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 🗄️ Restaurar cache de Telegram
        uses: actions/cache@v4
        with:
          path: |
            telegram_sent.json
            telegram_voice_sent.json
          key: telegram-cache-${{ github.run_id }}
          restore-keys: telegram-cache-
      - name: 📊 Actualizar badges del README
        run: python -m scripts.tools.update_readme_badges
      - name: 🤖 Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TOKEN_API_ID: ${{ secrets.TOKEN_API_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          if [ "${{ inputs.force_voice }}" = "true" ]; then
            python -m scripts.publishers.send_telegram --force-voice
          else
            python -m scripts.publishers.send_telegram
          fi
      - name: 💾 Commit badges actualizados
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add README.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "Sin cambios en badges."
          else
            git commit -m "📊 Actualizar badges del README [skip ci]"
            git checkout -- .
            git pull --rebase origin master
            git push origin master
          fi
