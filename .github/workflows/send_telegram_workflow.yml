name: "[NOTICIAS] 🤖 Send Telegram Notification"
on:
  schedule:
    - cron: "*/30 * * * *" # Cada 30 minutos
  workflow_dispatch:

jobs:
  send_telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: master
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 🗄️ Restaurar cache de Telegram
        uses: actions/cache@v4
        with:
          path: |
            telegram_sent.json
            telegram_voice_sent.json
          key: telegram-cache-${{ github.run_id }}
          restore-keys: telegram-cache-
      - name: 📊 Actualizar badges del README
        run: python -m scripts.tools.update_readme_badges
      - name: 🤖 Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TOKEN_API_ID: ${{ secrets.TOKEN_API_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.publishers.send_telegram
      - name: 💾 Commit badges actualizados
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add README.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "Sin cambios en badges."
          else
            git commit -m "📊 Actualizar badges del README [skip ci]"
            git pull --rebase origin master
            git push origin master
          fi
