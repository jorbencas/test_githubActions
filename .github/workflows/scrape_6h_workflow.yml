name: "[NOTICIAS] 🌐 Scraping Semidiario (tier standard)"
on:
  schedule:
    - cron: "0 */6 * * *" # Cada 6 horas
  workflow_dispatch:

concurrency:
  group: master-push
  cancel-in-progress: false

jobs:
  scrape_6h:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: master
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache Ollama models (compartida con el bot)
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-1.5b
          restore-keys: ollama-
      - name: 🦙 Instalar y arrancar Ollama (fallback traducción)
        run: |
          if ! command -v ollama >/dev/null; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s http://localhost:11434 >/dev/null && break
            sleep 1
          done
          ollama list | grep -q qwen2.5:1.5b || ollama pull qwen2.5:1.5b
      - name: 💻 Scrape news (tier standard — web sources)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_MODEL: qwen2.5:1.5b
        run: python -m scripts.scrapers.scrape_news --tier standard
      - name: 📝 Push cambios
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add files/noticias_historico.json files/avatars_cache.json
          git diff --quiet --cached || git commit -m "[bot] 6h scrape (tier standard)"
          git pull --rebase origin master
          git push origin master
