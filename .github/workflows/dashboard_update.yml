name: "[WEB] 🚀 Deploy gestor de fuentes"
on:
  push:
    branches: [master]
    paths:
      - 'public/**'
  workflow_dispatch:

concurrency:
  group: master-push
  cancel-in-progress: false

jobs:
  deploy_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master

      - name: ✨ Deploy a Surge
        run: npx surge public jorbencasdownloaderdocument.surge.sh --token ${{ secrets.SURGE_TOKEN }}
