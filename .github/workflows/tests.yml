name: "[DEV] 🧪 Python Tests"
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v
      # project_generator tiene sus propias deps (httpx, pydantic-settings,
      # python-telegram-bot, lxml) que no están en el requirements raíz.
      - name: Install project_generator dependencies
        run: pip install -r project_generator/requirements.txt
      - name: Run project_generator tests
        run: python -m pytest project_generator/tests/ -v
