name: "[NUEVE REINAS] 🎬 Recopilar info de la serie Nueve reinas (Netflix)"
on:
  schedule:
    - cron: "23 */6 * * *"   # Cada 6 horas: 00:23, 06:23, 12:23, 18:23 UTC
  workflow_dispatch:

jobs:
  recopilar_nueve_reinas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 0

      - name: ✅ Verificar checkout
        run: |
          git status
          test -d scripts/scrapers && echo "Éxito: scripts/scrapers presente"
          test -f scripts/scrapers/scrape_nueve_reinas.py && echo "Éxito: scrape_nueve_reinas.py presente"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests BeautifulSoup4 google-genai

      - name: 🎬 Recopilar información sobre Nueve reinas y enviar novedades
        id: scrape
        env:
          TIPS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALUDO_CHAT_ID: ${{ secrets.SALUDO_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/scrapers/scrape_nueve_reinas.py --enviar

      - name: 💾 Commit del archivo acumulado
        if: always()
        run: |
          git config user.name "nueve-reinas-bot"
          git config user.email "nueve-reinas-bot@users.noreply.github.com"
          git add files/nueve_reinas.json
          if git diff --cached --quiet; then
            echo "Sin cambios en nueve_reinas.json"
          else
            git commit -m "[nueve reinas] actualizar registro de la serie Nueve reinas (Netflix)"
            git push origin HEAD:master
          fi
