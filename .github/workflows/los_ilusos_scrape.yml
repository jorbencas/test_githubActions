name: "[LOS ILUSOS] 🎬 Recopilar info de Los ilusos 13+13 (2026)"
on:
  schedule:
    - cron: "37 */6 * * *"   # Cada 6 horas: 00:37, 06:37, 12:37, 18:37 UTC
  workflow_dispatch:

jobs:
  recopilar_los_ilusos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
          fetch-depth: 0

      - name: ✅ Verificar checkout
        run: |
          git status
          test -d scripts/scrapers && echo "Éxito: scripts/scrapers presente"
          test -f scripts/scrapers/scrape_los_ilusos.py && echo "Éxito: scrape_los_ilusos.py presente"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests BeautifulSoup4 google-genai

      - name: 🎬 Recopilar información sobre Los ilusos 13+13 y enviar novedades
        id: scrape
        env:
          TIPS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALUDO_CHAT_ID: ${{ secrets.SALUDO_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/scrapers/scrape_los_ilusos.py --enviar

      - name: 💾 Commit del archivo acumulado
        if: always()
        run: |
          git config user.name "los-ilusos-bot"
          git config user.email "los-ilusos-bot@users.noreply.github.com"
          git add files/los_ilusos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los_ilusos.json"
          else
            git commit -m "[los ilusos] actualizar registro de Los ilusos 13+13 (2026)"
            git push origin HEAD:master
          fi
