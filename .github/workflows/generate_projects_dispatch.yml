name: "[PROJECTS] Generate & Send Projects (dispatch from devjobs)"
on:
  repository_dispatch:
    types: [generate_projects]
  workflow_dispatch:
    inputs:
      count:
        description: "Number of projects to generate"
        required: false
        default: "5"
        type: string
      nivel:
        description: "Filter by level (junior/semisenior/senior)"
        required: false
        type: string
      scope:
        description: "Filter by scope (miniproyecto/proyecto/multiproyecto)"
        required: false
        type: string
      lenguaje:
        description: "Filter by language (python/javascript/typescript/csharp/go/rust)"
        required: false
        type: string
      ai_provider:
        description: "AI provider (openai/anthropic/gemini/deterministic)"
        required: false
        default: "gemini"
        type: string

concurrency:
  group: generate-projects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_and_send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: project_generator

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID: ${{ secrets.TELEGRAM_REPORTS_PROYECTOS_CHANNEL_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROVIDER: ${{ github.event.inputs.ai_provider }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gemini-1.5-flash' }}
      PROJECTS_PER_RUN: ${{ github.event.inputs.count }}
      SCRAPE_TUWEB_DEV: ${{ vars.SCRAPE_TUWEB_DEV || 'true' }}
      DATA_DIR: ./data

    steps:
      - name: Checkout test_githubActions
        uses: actions/checkout@v4
        with:
          repository: jorbencas/test_githubActions
          token: ${{ secrets.GH_PAT }}
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: project_generator/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r project_generator/requirements.txt

      - name: Create data directory
        run: mkdir -p project_generator/data

      - name: Generate projects
        id: generate
        run: |
          cd project_generator
          ARGS=()
          COUNT="${{ github.event.client_payload.count || github.event.inputs.count || 5 }}"
          AI_PROV="${{ github.event.client_payload.ai_provider || github.event.inputs.ai_provider || 'gemini' }}"
          if [[ -n "${{ github.event.client_payload.nivel || github.event.inputs.nivel }}" ]]; then
            ARGS+=(--nivel "${{ github.event.client_payload.nivel || github.event.inputs.nivel }}")
          fi
          if [[ -n "${{ github.event.client_payload.scope || github.event.inputs.scope }}" ]]; then
            ARGS+=(--scope "${{ github.event.client_payload.scope || github.event.inputs.scope }}")
          fi
          if [[ -n "${{ github.event.client_payload.lenguaje || github.event.inputs.lenguaje }}" ]]; then
            ARGS+=(--lenguaje "${{ github.event.client_payload.lenguaje || github.event.inputs.lenguaje }}")
          fi
          python -m src.main generate --count "$COUNT" "${ARGS[@]}" --send-telegram
        env:
          PYTHONPATH: project_generator/src
          AI_PROVIDER: ${{ github.event.client_payload.ai_provider || github.event.inputs.ai_provider || 'gemini' }}

      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-history
          path: project_generator/data/generated_projects.json
          retention-days: 90

      - name: Commit history if changed
        run: |
          cd project_generator
          if git diff --quiet data/generated_projects.json; then
            echo "No changes in history"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/generated_projects.json
            git commit -m "chore: update project history [skip ci]"
            git push origin master
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}